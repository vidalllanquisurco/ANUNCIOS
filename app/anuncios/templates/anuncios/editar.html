{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3 text-center">✏️ Editar Anuncio</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Título del Anuncio</label>
                    <input type="text" name="titulo" value="{{ anuncio.titulo }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria_id" class="form-select" required>
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id == anuncio.categoria_id %}selected{% endif %}>
                            {{ cat.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contenido</label>
                    <textarea name="contenido" rows="5" class="form-control" required>{{ anuncio.contenido }}</textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('anuncios.listar') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
