{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3 text-center">📝 Publicar Nuevo Anuncio</h3>
            
            <form method="POST">
                <!-- Título -->
                <div class="mb-3">
                    <label class="form-label">Título del Anuncio</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Escribe un título llamativo..." required>
                </div>

                <!-- Categoría (Desplegable dinámico desde la BD) -->
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria_id" class="form-select" required>
                        <option value="" disabled selected>Seleccione una categoría...</option>
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Contenido -->
                <div class="mb-3">
                    <label class="form-label">Contenido</label>
                    <textarea name="contenido" rows="5" class="form-control" placeholder="Escribe los detalles de tu anuncio..." required></textarea>
                </div>

                <!-- Botones de acción -->
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('anuncios.listar') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Publicar Anuncio</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
